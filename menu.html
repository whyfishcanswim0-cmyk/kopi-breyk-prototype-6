<!DOCTYPE html>
<html lang="en">
<head>
<title>Kopi Breyk Menu</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a0e1a">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="brand"><span><img src="logo.png" alt="">Our menu</span><nav class="topnav"><a href="/">Home</a><a href="/app">Rewards</a></nav></div>
  <div class="chips" id="chips"></div>
  <div id="menu"><p class="small">Loading…</p></div>
</main>
<div id="toast"></div>
<script src="config.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const peso = n => '₱' + Number(n).toLocaleString('en-PH', { maximumFractionDigits: 2 });
const row = i => `<div class="mi${i.available ? '' : ' so'}"><img class="mp ph" data-pid="${i.has_photo ? i.id : ''}" src="logo.png" alt=""><div class="mt"><b>${esc(i.name)}</b>${(i.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}${i.description ? `<p>${esc(i.description)}</p>` : ''}${i.available ? '' : '<p class="soldout">Sold out</p>'}</div><div class="mpr">${peso(i.price)}</div></div>`;
(async () => {
  const m = await rpc('get_menu');
  if (m.error) { document.querySelector('#menu').innerHTML = '<p class="err">' + esc(m.error) + '</p>'; return; }
  const cats = m.filter(c => c.items.length);
  if (!cats.length) { document.querySelector('#menu').innerHTML = '<p>Our menu is coming soon.</p>'; return; }
  const sp = cats.flatMap(c => c.items).filter(i => i.special && i.available);
  document.querySelector('#chips').innerHTML = (sp.length ? '<a href="#special">Today’s special</a>' : '') + cats.map(c => `<a href="#c${c.id}">${esc(c.name)}</a>`).join('');
  document.querySelector('#menu').innerHTML = (sp.length ? '<h2 id="special" class="mh">Today’s special</h2>' + sp.map(row).join('') : '') + cats.map(c => `<h2 id="c${c.id}" class="mh">${esc(c.name)}</h2>` + c.items.map(row).join('')).join('');
  document.querySelectorAll('img[data-pid]').forEach(async im => {
    if (!im.dataset.pid) return; const r = await rpc('get_menu_photo', { p_id: +im.dataset.pid });
    if (r.photo) { document.querySelectorAll(`img[data-pid="${im.dataset.pid}"]`).forEach(x => { x.src = r.photo; x.classList.remove('ph'); }); }
  });
})();
</script>
</body>
</html>
