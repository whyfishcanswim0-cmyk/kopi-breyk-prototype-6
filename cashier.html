<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kopi Breyk Cashier</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="brand"><span><img src="logo.png" alt="">Cashier</span><button id="out" hidden>Lock</button></div>
  <section id="login">
    <h2>Cashier login</h2>
    <label for="cp">Cashier PIN</label><input id="cp" class="pin" type="password" inputmode="numeric" maxlength="6">
    <p class="err" id="lerr"></p><button class="btn" id="go">Unlock</button>
  </section>

  <section id="panel" hidden>
    <h2>Record a sale</h2>
    <label for="un">Customer username</label>
    <div class="row"><div><input id="un" autocapitalize="none" autocorrect="off"></div><button class="btn ghost" id="find">Find</button></div>
    <button class="btn" id="scan" style="margin-top:10px">Scan member QR</button><video id="cam" playsinline muted hidden style="width:100%;border-radius:12px;margin-top:10px"></video><canvas id="cv" hidden></canvas><p class="small" id="scanmsg" style="margin:8px 0 0"></p>
    <div class="card" id="cust" hidden style="margin-top:14px"><div id="refbox" hidden style="margin-bottom:12px;border:1px solid var(--gold);border-radius:12px;padding:12px;text-align:left"><b>Referred by <span id="rname"></span></b><br><img id="rph" class="avatar" style="width:90px;height:90px;margin:8px 0" hidden>
      <label style="display:flex;gap:10px;align-items:flex-start;font-weight:400"><input type="checkbox" id="refok" style="margin-top:4px"> Confirm referral: I checked both photos and this is a new customer</label><button class="mini bad" id="refno" style="margin-top:8px">Reject referral</button></div>
      <img id="cph" class="avatar" style="width:120px;height:120px" hidden><b id="cn" style="font-size:1.2rem"></b><p class="small" id="cd"></p></div>
    <div id="form" hidden>
      <label for="amt">Receipt total (₱, before points)</label><input id="amt" type="number" inputmode="decimal" min="0" step="0.01">
      <label for="rc">Receipt number</label><input id="rc" autocapitalize="characters">
      <label for="use">Points to use (0 for none<span id="minhint"></span>)</label><input id="use" type="number" inputmode="numeric" min="0" value="0">
      <p class="small" id="prev" style="margin-top:10px"></p>
      <p class="err" id="err"></p>
      <button class="btn" id="rec">Record sale</button>
    </div>
    <details class="hist" id="av" style="margin-top:22px"><summary>Menu availability (sold-out switch)</summary><input id="avq" placeholder="Search items" style="margin:10px 0"><div id="avlist"></div></details>
    <div class="res" id="res" hidden><p id="rtxt" style="color:var(--ink);margin:0"></p><button class="btn ghost" id="next">Next customer</button></div>
  </section>
</main>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="config.js"></script>
<script>
let pin = sessionStorage.getItem('kb_cashier') || '', cu = null;
const C = (fn, a) => rpc(fn, { p_cashier: pin, ...a });
let cmin = 0; rpc('get_config').then(c => { if (c && c.min_redeem) { cmin = c.min_redeem; $('#minhint').textContent = ', or at least ' + cmin; } });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const refMsg = x => ({ ok: '<br><b>Referral confirmed. The referrer earned points.</b>', min: '<br>Referral NOT confirmed: the purchase is below the minimum.', cap: '<br>Referral NOT confirmed: the referrer reached this month’s limit.', photo: '<br>Referral NOT confirmed: the customer needs a profile photo.' }[x] || '');
const peso = n => '₱' + Number(n).toLocaleString('en-PH', { maximumFractionDigits: 2 });
async function unlock() {
  const r = await C('cashier_lookup', { p_user: '~' });
  if (r.error && /Wrong cashier PIN/.test(r.error)) return r.error;
  $('#login').hidden = true; $('#panel').hidden = false; $('#out').hidden = false; return null;
}
$('#go').onclick = async () => { pin = $('#cp').value; const e = await unlock(); if (e) { $('#lerr').textContent = e; return; } sessionStorage.setItem('kb_cashier', pin); };
$('#cp').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
$('#out').onclick = () => { sessionStorage.removeItem('kb_cashier'); location.reload(); };
$('#refno').onclick = async () => { if (!cu || !cu.referral || !confirm('Reject this referral? The referrer will not earn points.')) return; const r = await C('cashier_reject_referral', { p_id: cu.referral.id }); toast(r.error || 'Referral rejected'); if (!r.error) { cu.referral = null; $('#refbox').hidden = true; } };
let items = [];
async function loadItems() { const r = await C('cashier_items'); if (r.error) { toast(r.error); return; } items = r; drawItems(); }
function drawItems() { const q = $('#avq').value.trim().toLowerCase();
  $('#avlist').innerHTML = items.filter(i => (i.name + ' ' + i.category).toLowerCase().includes(q)).map(i => `<div class="hrow" style="align-items:center"><span>${esc(i.name)}<br><span class="small">${esc(i.category)}</span></span><button class="mini${i.available ? '' : ' bad'}" data-av="${i.id}">${i.available ? 'Available' : 'SOLD OUT'}</button></div>`).join('') || '<p class="small">No items.</p>'; }
$('#av').addEventListener('toggle', () => { if ($('#av').open) loadItems(); });
$('#avq').oninput = drawItems;
$('#avlist').onclick = async e => { const id = e.target.dataset.av; if (!id) return; const it = items.find(x => x.id == id);
  const r = await C('cashier_set_available', { p_id: +id, p_val: !it.available }); if (r.error) { toast(r.error); return; } it.available = !it.available; drawItems(); };
let stream = null, timer = null, det = null;
function stopCam() { clearInterval(timer); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $('#cam').hidden = true; $('#scan').textContent = 'Scan member QR'; }
const loadJsQR = () => new Promise(res => { if (typeof jsQR !== 'undefined') return res(true); const t = document.createElement('script'); t.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; t.onload = () => res(true); t.onerror = () => res(false); document.head.append(t); });
$('#scan').onclick = async () => {
  if (stream) return stopCam();
  $('#scanmsg').textContent = 'Starting camera…'; det = null;
  if ('BarcodeDetector' in window) { try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { det = null; } }
  if (!det && !(await loadJsQR())) { $('#scanmsg').textContent = 'The scanner could not load. Check the internet, or type the customer’s code instead.'; return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } }); }
  catch (e) { $('#scanmsg').textContent = 'The camera is blocked. Allow camera access for this site in your browser settings, or type the code.'; return; }
  const v = $('#cam'), cv = $('#cv'), x = cv.getContext('2d', { willReadFrequently: true }); v.srcObject = stream; v.hidden = false; await v.play();
  $('#scan').textContent = 'Stop scanning'; $('#scanmsg').textContent = 'Point the camera at the customer’s QR…';
  let busy = false;
  timer = setInterval(async () => {
    if (busy || !v.videoWidth) return; busy = true;
    try {
      let data = null;
      if (det) { const r = await det.detect(v); if (r.length) data = r[0].rawValue; }
      else { const w = Math.min(v.videoWidth, 720), h = Math.round(v.videoHeight * w / v.videoWidth); cv.width = w; cv.height = h; x.drawImage(v, 0, 0, w, h);
        const q = jsQR(x.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' }); if (q) data = q.data; }
      if (data) { if (data.startsWith('KB:')) { $('#un').value = data.slice(3); $('#scanmsg').textContent = ''; stopCam(); $('#find').click(); } else $('#scanmsg').textContent = 'That QR is not a Kopi Breyk member code.'; }
    } catch (e) {}
    busy = false;
  }, 300);
};
$('#find').onclick = async () => {
  const r = await C('cashier_lookup', { p_user: $('#un').value }); $('#err').textContent = '';
  if (r.error) { toast(r.error); $('#cust').hidden = true; $('#form').hidden = true; cu = null; return; }
  cu = r; $('#refbox').hidden = !r.referral; if (r.referral) { $('#rname').textContent = r.referral.referrer_name; $('#rph').hidden = !r.referral.referrer_photo; if (r.referral.referrer_photo) $('#rph').src = r.referral.referrer_photo; $('#refok').checked = false; }
  $('#cph').hidden = !r.photo; if (r.photo) $('#cph').src = r.photo; $('#cn').textContent = `${r.name || r.username} (${r.username})`;
  $('#cd').textContent = `${r.points} points (worth ${peso(r.points * r.peso)}) · ${r.spins} free spin${r.spins === 1 ? '' : 's'}` + (r.photo ? '' : ' · NO PHOTO YET: points can’t be used');
  $('#cust').hidden = false; $('#form').hidden = false; preview();
};
function preview() {
  if (!cu) return; const a = +$('#amt').value || 0, u = +$('#use').value || 0, d = u * cu.peso;
  $('#prev').textContent = a ? (u > 0 && u < cmin ? 'Minimum ' + cmin + ' points to redeem.' : d > a ? 'Discount is bigger than the bill.' : `Discount ${peso(d)} · Customer pays ${peso(a - d)} · Earns ${Math.floor((a - d) / 100)} point(s)`) : '';
}
['#amt', '#use'].forEach(s => $(s).oninput = preview);
$('#rec').onclick = async () => {
  $('#err').textContent = ''; $('#rec').disabled = true;
  const r = await C('cashier_record', { p_user: cu.username, p_amount: +$('#amt').value, p_receipt: $('#rc').value, p_use: Math.floor(+$('#use').value || 0), p_ref: $('#refok').checked });
  $('#rec').disabled = false;
  if (r.error) { $('#err').textContent = r.error; return; }
  $('#form').hidden = true; $('#cust').hidden = true; $('#res').hidden = false;
  $('#rtxt').innerHTML = `<b>Collect ${peso(r.collect)}</b>${r.discount ? ` (${peso(r.discount)} discount applied in the POS)` : ''}<br>${cu.username} earned ${r.earned} point(s). New balance: ${r.points} points.${r.spin_awarded ? '<br><b>Free spin awarded!</b>' : ''}${refMsg(r.referral)}`;
};
$('#next').onclick = () => { $('#res').hidden = true; ['#un', '#amt', '#rc'].forEach(s => $(s).value = ''); $('#use').value = 0; $('#prev').textContent = ''; cu = null; };
if (pin) unlock().then(e => { if (e) sessionStorage.removeItem('kb_cashier'); });
</script>
</body>
</html>
